name: Hello DevOps CI

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Get the Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
	with:
	  node-version:22
	  cache:npm

      - name: Install Dependencies
	run: npm ci

      - name: Validate HTML
	run: npm test


